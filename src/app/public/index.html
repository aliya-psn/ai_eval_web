<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI评测平台</title>
    <style>

      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="ai_eval_web" data-element-id="ai_eval_web" class="ai_eval_web-plugin"></div>
  </body>
